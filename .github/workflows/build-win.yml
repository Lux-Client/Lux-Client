name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pull requests from forks have no access to the private backend, they only get frontend-check.yml
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout (with private backend submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Either a fine-grained token with read access to Lux-Launcher-Backend (BACKEND_TOKEN)
          # or a read-only deploy key (BACKEND_DEPLOY_KEY) works.
          token: ${{ secrets.BACKEND_TOKEN || github.token }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}

      - name: Compute build SHA (PR head or push SHA)
        id: vars
        shell: bash
        run: |
          BUILD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${BUILD_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set Electron cache dirs
        shell: bash
        run: |
          echo "ELECTRON_CACHE_DIR=$LOCALAPPDATA\\electron\\Cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE_DIR=$LOCALAPPDATA\\electron-builder\\Cache" >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE_DIR }}
            ${{ env.ELECTRON_BUILDER_CACHE_DIR }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Inject OAuth client identifiers
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
        run: node scripts/write-oauth-clients.js

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add SHA to release filenames
        shell: pwsh
        run: |
          if (Test-Path "release") {
            Get-ChildItem -Path "release" -File | ForEach-Object {
              $newName = "$($_.BaseName)-$env:SHORT_SHA$($_.Extension)"
              Rename-Item -Path $_.FullName -NewName $newName -Force
            }
          }

      - name: Check release artifacts exist
        id: relcheck
        shell: bash
        run: |
          if [[ -d "release" ]] && compgen -G "release/*" > /dev/null; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release artifacts
        if: steps.relcheck.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-win-${{ env.SHORT_SHA }}
          path: release/
          if-no-files-found: error
          compression-level: 6
