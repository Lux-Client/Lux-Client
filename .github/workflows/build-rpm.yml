name: Build RPM

permissions: {}

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: build-rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute build SHA (PR head or push SHA)
        id: vars
        shell: bash
        run: |
          BUILD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${BUILD_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set Electron cache dirs
        shell: bash
        run: |
          echo "ELECTRON_CACHE_DIR=$HOME/.cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE_DIR=$HOME/.cache/electron-builder" >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        uses: actions/cache@3624ceb22c1c5a301c8db4169662070a689d9ea8 # v4.1.1
        with:
          path: |
            ${{ env.ELECTRON_CACHE_DIR }}
            ${{ env.ELECTRON_BUILDER_CACHE_DIR }}
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject OAuth client identifiers
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
        run: node scripts/write-oauth-clients.js

      - name: Build
        run: pnpm build

      - name: Package
        run: npx electron-builder --linux rpm --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add SHA to release filenames
        shell: bash
        run: |
          shopt -s nullglob
          for f in release/*; do
            [[ -f "$f" ]] || continue
            filename="$(basename "$f")"
            if [[ "$filename" == *.* ]]; then
              base="${filename%.*}"
              ext="${filename##*.}"
              mv -n "$f" "release/${base}-${SHORT_SHA}.${ext}"
            else
              mv -n "$f" "release/${filename}-${SHORT_SHA}"
            fi
          done

      - name: Check release artifacts exist
        id: relcheck
        shell: bash
        run: |
          if [[ -d "release" ]] && compgen -G "release/*" > /dev/null; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release artifacts
        if: steps.relcheck.outputs.has_release == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-rpm-${{ env.SHORT_SHA }}
          path: release/
          if-no-files-found: error
          compression-level: 6
