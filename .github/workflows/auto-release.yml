name: Auto Release

permissions: {}

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "TECHSTACK.md"
      - "LICENSE.md"
      - "SECRURITY.md"
      - "STYLEGUIDE.md"
      - "TODO.md"
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.check_release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read launcher version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const tag = `v${require('./package.json').version}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.info(`Release ${tag} exists (id: ${release.id}). Assets will be replaced.`);
              core.setOutput('release_id', String(release.id));
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release for ${tag}. A new release will be created.`);
                core.setOutput('release_id', '');
              } else {
                throw error;
              }
            }

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win
            os: windows-latest
            artifact: release-win
            package_cmd: npx electron-builder --win --publish never
          - id: mac
            os: macos-latest
            artifact: release-mac
            package_cmd: npx electron-builder --mac --publish never
          - id: appimage
            os: ubuntu-latest
            artifact: release-appimage
            package_cmd: npx electron-builder --linux AppImage --publish never
          - id: deb
            os: ubuntu-latest
            artifact: release-deb
            package_cmd: npx electron-builder --linux deb --publish never
          - id: rpm
            os: ubuntu-latest
            artifact: release-rpm
            package_cmd: npx electron-builder --linux rpm --publish never

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject OAuth client identifiers
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
        run: node scripts/write-oauth-clients.js

      - name: Build
        run: pnpm build

      - name: Package
        run: ${{ matrix.package_cmd }}
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload release artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*-${{ needs.prepare.outputs.version }}
          merge-multiple: true
          path: release-artifacts

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          for file in *; do
            [[ "$file" == *.sha256 || -d "$file" ]] && continue
            sha256sum "$file" > "${file}.sha256"
            echo "Generated checksum for $file"
          done

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          node backend/utils/release-manifest.js ./release-artifacts ${{ needs.prepare.outputs.version }}

      - name: Sign release manifest
        shell: bash
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          SIGNING_KEY=$(echo "$MANIFEST_SIGNING_KEY" | base64 -d)
          MANIFEST_PATH="./release-artifacts/release-manifest.json"
          SIGNATURE=$(printf '%s' "$(cat "$MANIFEST_PATH")" | openssl dgst -sha256 -hmac "$SIGNING_KEY" | sed 's/^.* //')
          # Read manifest, replace signature, write back
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('$MANIFEST_PATH', 'utf8'));
            manifest.signature = '$SIGNATURE';
            fs.writeFileSync('$MANIFEST_PATH', JSON.stringify(manifest, null, 2));
          "
          echo "Manifest signed with HMAC-SHA256"

      - name: Delete old installer assets from existing release
        if: needs.prepare.outputs.release_id != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const releaseId = parseInt('${{ needs.prepare.outputs.release_id }}');
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100
            });
            const installerExts = ['.exe', '.dmg', '.AppImage', '.deb', '.rpm', '.sha256'];
            const toDelete = assets.filter(a => installerExts.some(ext => a.name.endsWith(ext)) || a.name === 'release-manifest.json');
            for (const asset of toDelete) {
              core.info(`Deleting old asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }
            core.info(`Deleted ${toDelete.length} old installer asset(s).`);

      - name: Create or update GitHub release
        id: create_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            gh release edit "$TAG" --title "Lux $TAG"
            if [ "$IS_DRAFT" = "true" ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" --title "Lux $TAG" --generate-notes
          fi

          CURRENT_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$CURRENT_DRAFT" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi

          gh release upload "$TAG" \
            release-artifacts/*.exe \
            release-artifacts/*.dmg \
            release-artifacts/*.AppImage \
            release-artifacts/*.deb \
            release-artifacts/*.rpm \
            release-artifacts/*.sha256 \
            release-artifacts/release-manifest.json \
            --clobber

          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
